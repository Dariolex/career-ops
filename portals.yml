# Filtro sul CORPO dell'annuncio (job.description), non sul titolo. Applica a
# costo zero il deal-breaker sul tedesco fluente definito in modes/_profile.md,
# prima che l'offerta consumi token di triage o di valutazione completa.
#
# PORTATA REALE (scan.mjs:520-523): solo il provider Lever espone la descrizione
# nel payload di lista. Greenhouse, Ashby, Workday e iCIMS lasciano il campo
# vuoto e passano sempre questo filtro. Oggi incide quindi su poche aziende
# tracciate; il valore cresce con lo sweep ATS completo, che copre Lever in
# ampiezza. Per tutto il resto il deal-breaker resta applicato a valle, dal
# triage (modes/_brief.md) e dalla valutazione completa (modes/_profile.md).
#
# CRITERIO: solo formulazioni inequivocabilmente vincolanti. Il tedesco come
# "plus" o "nice-to-have" NON deve essere bloccato, e un match di sottostringa
# non sa distinguere "fluent German required" da "fluent German is a plus":
# i casi ambigui vengono lasciati passare di proposito, perche' a valle il
# modello legge la JD intera e sa fare quella distinzione.
content_filter:
  negative:
    # -- Tedesco: formulazioni tedesche di requisito --
    - "verhandlungssicheres Deutsch"
    - "verhandlungssichere Deutschkenntnisse"
    - "Deutschkenntnisse zwingend"
    - "Deutsch zwingend erforderlich"
    - "muttersprachliche Deutschkenntnisse"
    - "Deutsch auf muttersprachlichem Niveau"
    # -- Tedesco: formulazioni inglesi di requisito --
    - "fluent German is required"
    - "fluent German required"
    - "fluency in German is required"
    - "German fluency is required"
    - "German fluency required"
    - "must be fluent in German"
    - "must speak fluent German"
    - "native German speaker required"

# Aziende con team privacy e AI governance strutturati nelle geografie target.
# La lista non pretende di essere esaustiva: scan-ats-full.mjs copre il resto
# spazzando l'intero dataset ATS pubblico con gli stessi filtri di titolo.
#
# ATTENZIONE — board NON scansionabili, verificati il 2026-08-20. Non riaggiungerli
# sulla fiducia di discover-ats.mjs: lo script risolve per slug e su questi nomi
# becca omonimie, non i board reali.
#   SAP        -> sap.bamboohr.com: account demo. 4 annunci generici a Mayfair e
#                 Marsiglia, con campi incoerenti (city Berlin / state Brandenburg).
#   Personio   -> personio.recruitee.com: sandbox. Unico annuncio "API Job - Berlin -
#                 Musterstr 1", company_name "FD Sandbox".
# Restano irrisolti (portali JS-rendered, board trovati ma con 0 annunci):
#   Booking.com, Bending Spoons, Siemens, Zalando. Valgono un nuovo tentativo piu'
#   avanti, oppure li copre lo sweep ATS completo.
tracked_companies:

  # -- Dublino: headquarter EMEA con team privacy consolidati --
  - name: Stripe
    careers_url: https://stripe.com/jobs
    api: https://boards-api.greenhouse.io/v1/boards/stripe/jobs
    enabled: true
    notes: "Dublino: hub EMEA, team legal e privacy."
