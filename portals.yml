# portals.yml — Dario Career Intelligence
# Letto da scan.mjs e scan-ats-full.mjs.

scan_history:
  recheck_after_days: 30

title_filter:
  positive:
    # -- AI governance e regolamentazione --
    - "AI Governance"
    - "AI Policy"
    - "AI Compliance"
    - "AI Regulatory"
    - "AI Risk"
    - "Responsible AI"
    - "AI Act"
    - "AI Ethics"
    - "Algorithmic Accountability"
    - "AI + Counsel"
    - "AI + Legal"
    - "AI + Governance"
    # -- Privacy e data protection --
    - "Data Protection Officer"
    - "Data Protection"
    - "Privacy Counsel"
    - "Privacy Officer"
    - "Privacy Manager"
    - "Privacy Lead"
    - "Privacy Program"
    - "Privacy Engineer"
    - "Data Privacy"
    - "GDPR"
    - "DPO"
    # -- Legal, technology e cyber --
    - "Technology Counsel"
    - "Technology Law"
    - "Digital Regulation"
    - "Regulatory Counsel"
    - "Regulatory Affairs"
    - "Legal Counsel"
    - "Senior Counsel"
    - "Compliance Manager"
    - "Compliance Officer"
    - "Cybersecurity + Counsel"
    - "Cyber + Legal"
    - "Data Governance"
    - "Risk + Compliance"
    # -- Italiano --
    - "Responsabile Protezione Dati"
    - "Responsabile Privacy"
    - "Consulente Privacy"
    - "Legale"
    - "Affari Regolamentari"
    - "Conformita"
    # -- Tedesco --
    - "Datenschutz"
    - "Datenschutzbeauftragter"
    - "Compliance Manager"
    - "Justiziar"
    - "Syndikusrechtsanwalt"
  negative:
    # Escludere i ruoli tecnici e commerciali che condividono keyword
    - "Software Engineer"
    - "Data Engineer"
    - "Data Scientist"
    - "Machine Learning Engineer"
    - "Sales"
    - "Account Executive"
    - "Recruiter"
    - "Intern"
    - "Internship"
    - "Working Student"
    - "Werkstudent"
    - "Praktikum"
    - "Tirocinio"
    - "Stage"
    - "Apprentice"
    - "Graduate Program"
  seniority_boost:
    - "Senior"
    - "Lead"
    - "Head of"
    - "Principal"
    - "Director"
    - "Manager"

location_filter:
  # always_allow ha precedenza su block: salva gli annunci multi-sede che
  # nominano una delle geografie target.
  always_allow:
    - "Italy"
    - "Italia"
    - "Milan"
    - "Milano"
    - "Rome"
    - "Roma"
    - "Ireland"
    - "Dublin"
    - "Netherlands"
    - "Amsterdam"
  allow:
    - "Remote Europe"
    - "EMEA Remote"
    - "Remote - EMEA"
    - "Remote (EU)"
    - "Hybrid"
    - "Italy"
    - "Italia"
    - "Ireland"
    - "Dublin"
    - "Netherlands"
    - "Amsterdam"
    - "Rotterdam"
    - "The Hague"
